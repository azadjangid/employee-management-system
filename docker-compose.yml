# Optional: run PostgreSQL in Docker instead of installing it.
#   docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ems
    ports:
      - "5432:5432"
    volumes:
      - ems-pgdata:/var/lib/postgresql/data

volumes:
  ems-pgdata:
